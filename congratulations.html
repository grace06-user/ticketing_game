<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>축하합니다</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #800080;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    h1 { font-size: clamp(2.5rem, 10vw, 6rem); }

    button {
      display: block;
      margin: 1.5rem auto 0;
      padding: 0.75rem 1.25rem;
      border: 2px solid currentColor;
      border-radius: 0.5rem;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>축하합니다</h1>
    <p id="seat"></p>
      <button id="retry" type="button" onclick="window.location.href='./index.html'">
    다시하기
  </button>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const row = Number(query.get('row'));
    const seat = Number(query.get('seat'));
    document.querySelector('#seat').textContent =
      Number.isInteger(row) && Number.isInteger(seat)
        ? `${row}열${seat}번석 예매에 성공하셨습니다.`
        : '';
  </script>
  <script>
    // Override the result screen with the selected seat's outcome.
    const resultQuery = new URLSearchParams(window.location.search);
    const resultRow = Number(resultQuery.get('row'));
    const resultSeat = Number(resultQuery.get('seat'));
    const validSeat = Number.isInteger(resultRow) && resultRow >= 1 && resultRow <= 10 &&
      Number.isInteger(resultSeat) && resultSeat >= 1 && resultSeat <= 10;
    const centerSeat = resultSeat >= 4 && resultSeat <= 7;
    let resultMessage = '\uD2F0\uCF13\uD305 \uC2E4\uD328';
    let resultBackground = '#000';

    if (validSeat) {
      if (resultRow === 1 && centerSeat) {
        resultMessage = '\uD2F0\uCF13\uD305\uC758 \uC2E0';
        resultBackground = '#800080';
      } else if ((resultRow === 1 && !centerSeat) || resultRow === 2 || resultRow === 3) {
        resultMessage = '\uD2F0\uCF13\uD305 \uB300\uC131\uACF5';
        resultBackground = '#16803c';
      } else if (resultRow >= 4 && resultRow <= 6 && centerSeat) {
        resultMessage = '\uB9CC\uC871\uC2A4\uB7EC\uC6B4 \uC790\uB9AC';
        resultBackground = '#a8d950';
      } else if ((resultRow >= 4 && resultRow <= 6 && !centerSeat) ||
          (resultRow === 7 && centerSeat)) {
        resultMessage = '\uB098\uC058\uC9C0\uB294 \uC54A\uC544';
        resultBackground = '#f2c230';
      } else {
        resultMessage = '\uC131\uACF5\uD55C \uAC8C \uC5B4\uB514\uC57C';
        resultBackground = '#e87819';
      }
    }

    document.body.style.background = resultBackground;
    document.querySelector('h1').textContent = resultMessage;
    document.querySelector('#seat').textContent = validSeat
      ? `${resultRow}\uC5F4${resultSeat}\uBC88\uC11D \uC608\uB9E4\uC5D0 \uC131\uACF5\uD558\uC168\uC2B5\uB2C8\uB2E4.`
      : '';
    const retry = document.querySelector('#retry');
    retry.textContent = '\uB2E4\uC2DC\uD558\uAE30';
    retry.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
