<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무작위로 사라지는 보라색 상자</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 16px);
      gap: 4px;
    }

    .square {
      width: 16px;
      height: 16px;
      background: #800080;
      cursor: pointer;
      transition: opacity 180ms ease;
    }

    .square.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="grid" aria-label="10초 동안 무작위로 사라지는 보라색 상자 100개"></main>
  <script>
    const grid = document.querySelector('#grid');
    const squares = Array.from({ length: 100 }, () => {
      const square = document.createElement('div');
      square.className = 'square';
      grid.append(square);
      return square;
    });

    // Rows 1–3 disappear in order. For rows 4–6, every center seat (4–7)
    // disappears before any edge seat. Rows 7–9 follow the same grouping;
    // row 10 then finishes last.
    const delays = squares.map((_, index) => {
      const row = Math.floor(index / 10);
      const seat = (index % 10) + 1;
      const isCenter = seat >= 4 && seat <= 7;
      if (row < 3) {
        return row * 100 + Math.random() * 100;
      }
      if (row <= 5) {
        return isCenter
          ? 300 + Math.random() * 400
          : 700 + Math.random() * 400;
      }
      if (row <= 8) {
        return isCenter
          ? 1100 + Math.random() * 900
          : 2000 + Math.random() * 900;
      }
      const rowStart = 2900;
      return isCenter
        ? rowStart + Math.random() * 300
        : rowStart + 300 + Math.random() * 300;
    });
    squares.forEach((square, index) => {
      window.setTimeout(() => square.classList.add('hidden'), delays[index]);
      square.addEventListener('click', () => {
        if (!square.classList.contains('hidden')) {
          const row = Math.floor(index / 10) + 1;
          const seat = (index % 10) + 1;
          window.location.href = `congratulations.html?row=${row}&seat=${seat}`;
        }
      });
    });

    // No selection before all squares disappear leads to the failure screen.
    window.setTimeout(() => {
      window.location.href = 'congratulations.html?result=failure';
    }, 3700);
  </script>
</body>
</html>
