<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티켓팅 게임</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 16px);
      gap: 4px;
    }

    .square {
      width: 16px;
      height: 16px;
      background: #800080;
      cursor: pointer;
      transition: opacity 180ms ease;
    }

    .square.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="grid" aria-label="10초 동안 무작위로 사라지는 보라색 상자 100개"></main>
  <script>
    const grid = document.querySelector('#grid');
    const reserveButton = document.createElement('button');
    reserveButton.type = 'button';
    reserveButton.textContent = '\uC608\uB9E4\uD558\uAE30';
    reserveButton.textContent = '예매하기';
    reserveButton.textContent = '\uC608\uB9E4\uD558\uAE30';
    reserveButton.style.cssText = 'display:block; position:relative; left:200px; top:-200px; margin:-.25rem auto 0; padding:.375rem .625rem; border:0; border-radius:.25rem; background:#800080; color:#fff; cursor:pointer; font:inherit; font-size:.55rem;';
    grid.insertAdjacentElement('afterend', reserveButton);
    let selectedSquare = null;
    let selectedSeat = null;
    let selectedExpired = false;
    let noticeButton = null;
    const hideTimers = [];
    const squares = Array.from({ length: 100 }, () => {
      const square = document.createElement('div');
      square.className = 'square';
      grid.append(square);
      return square;
    });

    // Rows 1–3 disappear in order. For rows 4–6, every center seat (4–7)
    // disappears before any edge seat. Rows 7–9 follow the same grouping;
    // row 10 then finishes last.
    const delays = squares.map((_, index) => {
      const row = Math.floor(index / 10);
      const seat = (index % 10) + 1;
      const isCenter = seat >= 4 && seat <= 7;
      if (row < 3) {
        return row * 100 + Math.random() * 100;
      }
      if (row <= 5) {
        return isCenter
          ? 300 + Math.random() * 400
          : 700 + Math.random() * 400;
      }
      if (row <= 8) {
        return isCenter
          ? 1100 + Math.random() * 900
          : 2000 + Math.random() * 900;
      }
      const rowStart = 2900;
      return isCenter
        ? rowStart + Math.random() * 300
        : rowStart + 300 + Math.random() * 300;
    });
    const selectionDuration = row => row <= 4 ? 200 : row <= 8 ? 400 : 1000;

    const showExpiredNotice = () => {
      if (noticeButton) return;
      noticeButton = document.createElement('button');
      noticeButton.type = 'button';
      noticeButton.textContent = '이미 선택된 좌석입니다.';
      noticeButton.textContent = '\uC774\uBBF8 \uC120\uD0DD\uB41C \uC88C\uC11D\uC785\uB2C8\uB2E4.';
      noticeButton.style.cssText = 'position:fixed; top:24px; left:50%; transform:translateX(-50%); padding:.75rem 1.25rem; border:0; border-radius:.5rem; background:#222; color:#fff; cursor:pointer; font:inherit; font-size:1rem;';
      noticeButton.addEventListener('click', () => {
        noticeButton.remove();
        noticeButton = null;
        selectedSquare = null;
        selectedSeat = null;
        selectedExpired = false;
      });
      document.body.append(noticeButton);
    };

    squares.forEach((square, index) => {
      hideTimers[index] = window.setTimeout(() => square.classList.add('hidden'), delays[index]);
      square.addEventListener('click', () => {
        if (square.classList.contains('hidden') || selectedSeat) return;

        const row = Math.floor(index / 10) + 1;
        clearTimeout(hideTimers[index]);
        square.style.backgroundColor = '#808080';
        selectedSquare = square;
        selectedSeat = { row, seat: (index % 10) + 1 };
        selectedExpired = false;
        window.setTimeout(() => {
          square.classList.add('hidden');
          selectedExpired = true;
        }, selectionDuration(row));
      });
    });

    reserveButton.addEventListener('click', () => {
      if (!selectedSeat) return;
      if (selectedExpired) {
        showExpiredNotice();
        return;
      }
      window.location.href = `congratulations.html?row=${selectedSeat.row}&seat=${selectedSeat.seat}`;
    });

    window.setTimeout(() => {
      window.location.href = 'congratulations.html?result=failure';
    }, 3500);
  </script>
</body>
</html>
